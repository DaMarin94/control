databases:
  # Base Postgres gratuita; la region debe coincidir con la del web service
  - name: control-db
    plan: free
    region: ohio  # ajustar si se elige otra region; debe coincidir con el servicio

services:
  - type: web
    name: control-backend
    runtime: node
    rootDir: backend
    plan: free
    region: ohio  # debe coincidir con la region de control-db
    buildCommand: pnpm install --prod=false && pnpm build
    startCommand: pnpm start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

      # JWT_SECRET se setea a mano en el dashboard de Render (sync: false = no se versiona)
      - key: JWT_SECRET
        sync: false

      # DATABASE_URL se enlaza automaticamente desde la base control-db
      - key: DATABASE_URL
        fromDatabase:
          name: control-db
          property: connectionString

      # PORT lo inyecta Render automaticamente en cada deploy; NO declararlo aqui
